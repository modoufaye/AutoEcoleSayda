server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads volumineux (backend : max 200MB)
    client_max_body_size 210M;

    # Resolver DNS interne Docker (résolution dynamique de l'upstream)
    resolver 127.0.0.11 valid=10s;

    # API → backend Spring Boot (DNS interne CapRover)
    location /api/ {
        set $backend "srv-captain--sayda-backend:8080";
        proxy_pass http://$backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
    }

    # Fichiers uploadés servis par le backend
    location /uploads/ {
        set $backend "srv-captain--sayda-backend:8080";
        proxy_pass http://$backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── PWA ──────────────────────────────────────────────
    # Le service worker ne doit JAMAIS être mis en cache : c'est lui qui
    # porte la version de l'app. Un sw.js figé en cache = des utilisateurs
    # bloqués indéfiniment sur une ancienne version.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type "application/manifest+json";
    }

    # Les assets sont hachés par Vite : cache long sans risque.
    # Un seul en-tête Cache-Control (pas de `expires`, qui en ajouterait un second).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA React (fallback index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
