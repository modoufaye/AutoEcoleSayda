<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover : l'app occupe l'écran jusque sous l'encoche iPhone,
         les retraits sont repris en CSS via env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Couleur de la barre système une fois l'app installée -->
    <meta name="theme-color" content="#1e3a5f" />

    <!-- iOS ignore le manifeste : l'ajout à l'écran d'accueil passe par ces balises -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Khadija" />

    <title>Auto-École Khadija</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
