# Met en ligne le serveur de chaque auto-école active de deploy/clients.json, à chaque push sur main
# touchant le serveur. GitHub construit et teste le .jar une seule fois, puis l'envoie tel quel à
# l'app CapRover de chaque auto-école : le serveur CapRover ne compile plus rien.
# Jetons : un secret GitHub par auto-école, nommé dans clients.json (jetonServeur).
name: Déploiement du serveur

on:
  push:
    branches: [main]
    paths: ['src/**', 'pom.xml', 'deploy/serveur/**', 'deploy/clients.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      liste: ${{ steps.l.outputs.liste }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # La version (commit) part dans le .jar : /api/auth/version la renvoie une fois en ligne
      - name: Construire et tester le serveur
        run: |
          echo "$GITHUB_SHA" > src/main/resources/build-version.txt
          mvn -q -B package
          cp target/auto-ecole-1.0.0.jar app.jar

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serveur
          path: app.jar
          retention-days: 3

      - id: l
        run: echo "liste=$(jq -c '[.[] | select(.actif == true)]' deploy/clients.json)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: construire
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJSON(needs.construire.outputs.liste) }}
    concurrency:
      group: deploy-serveur-${{ matrix.client.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: serveur

      - name: Préparer l'archive
        run: |
          mkdir envoi
          cp app.jar envoi/app.jar
          cp deploy/serveur/Dockerfile envoi/Dockerfile
          printf '{\n  "schemaVersion": 2,\n  "dockerfilePath": "./Dockerfile"\n}\n' > envoi/captain-definition
          tar -cf serveur.tar -C envoi .

      - name: Déployer sur CapRover (app ${{ matrix.client.appServeur }})
        env:
          CAPROVER_TOKEN: ${{ secrets[matrix.client.jetonServeur] }}
        # Sans jeton, l'outil demande un mot de passe puis quitte en signalant un succès : on refuse
        # donc de partir sans jeton. Avec un jeton, CapRover rend la main dès l'envoi (« in progress »)
        # sans attendre la mise en route : l'étape suivante vérifie la vraie mise en ligne.
        run: |
          if [ -z "$CAPROVER_TOKEN" ]; then
            echo "::error::Secret ${{ matrix.client.jetonServeur }} absent (CapRover → app ${{ matrix.client.appServeur }} → Deployment → App Token)"; exit 1
          fi
          npx --yes caprover@2.4.4 deploy \
            --caproverUrl https://captain.khadija.auto-ecole.sn \
            --appToken "$CAPROVER_TOKEN" \
            --appName ${{ matrix.client.appServeur }} \
            --tarFile serveur.tar < /dev/null 2>&1 | tee deploy.log
          grep -qE "Deployed successfully|using app token is in progress" deploy.log \
            || { echo "::error::CapRover a refusé l'envoi"; exit 1; }

      # Le serveur n'a pas d'adresse publique : on passe par le site, qui relaie /api.
      - name: Vérifier que le nouveau serveur est en ligne
        run: |
          for i in $(seq 1 60); do
            v=$(curl -s https://${{ matrix.client.domaine }}/api/auth/version | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
            [ "$v" = "$GITHUB_SHA" ] && { echo "Serveur en ligne : $v"; exit 0; }
            sleep 10
          done
          echo "::error::Le serveur en ligne est toujours la version « $v », pas $GITHUB_SHA"; exit 1
