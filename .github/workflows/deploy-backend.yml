# Met le serveur (app CapRover « sayda-backend ») en ligne à chaque push sur main touchant le backend.
# Jeton : secret GitHub CAPROVER_TOKEN_BACKEND (CapRover → app sayda-backend → Deployment → App Token).
name: Déploiement du serveur

on:
  push:
    branches: [main]
    paths: ['src/**', 'pom.xml', 'Dockerfile', 'captain-definition']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Compile et lance les tests ici : une erreur arrête tout avant de toucher au serveur
      - name: Vérifier que le serveur se construit
        run: mvn -q -B package

      # La version (commit) part avec l'archive : /api/auth/version la renvoie une fois en ligne
      - name: Préparer l'archive
        run: |
          git archive --format=tar -o backend.tar HEAD Dockerfile captain-definition pom.xml src
          mkdir -p version/src/main/resources
          echo "$GITHUB_SHA" > version/src/main/resources/build-version.txt
          tar -rf backend.tar -C version src/main/resources/build-version.txt

      - name: Déployer sur CapRover
        env:
          CAPROVER_TOKEN: ${{ secrets.CAPROVER_TOKEN_BACKEND }}
        # Sans jeton, l'outil demande un mot de passe puis quitte en signalant un succès : on refuse
        # donc de partir sans jeton. Avec un jeton, CapRover rend la main dès l'envoi (« in progress »)
        # sans attendre la construction : l'étape suivante vérifie la vraie mise en ligne.
        run: |
          if [ -z "$CAPROVER_TOKEN" ]; then
            echo "::error::Secret CAPROVER_TOKEN_BACKEND absent (CapRover → app sayda-backend → Deployment → App Token)"; exit 1
          fi
          npx --yes caprover@2.4.4 deploy \
            --caproverUrl https://captain.khadija.auto-ecole.sn \
            --appToken "$CAPROVER_TOKEN" \
            --appName sayda-backend \
            --tarFile backend.tar < /dev/null 2>&1 | tee deploy.log
          grep -qE "Deployed successfully|using app token is in progress" deploy.log \
            || { echo "::error::CapRover a refusé l'envoi"; exit 1; }

      # Le serveur n'a pas d'adresse publique : on passe par le site, qui relaie /api.
      # On attend que /api/auth/version renvoie ce commit (construction Maven comprise : ~15 min max).
      - name: Vérifier que le nouveau serveur est en ligne
        run: |
          for i in $(seq 1 90); do
            v=$(curl -s https://www.khadija.auto-ecole.sn/api/auth/version | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
            [ "$v" = "$GITHUB_SHA" ] && { echo "Serveur en ligne : $v"; exit 0; }
            sleep 10
          done
          echo "::error::Le serveur en ligne est toujours la version « $v », pas $GITHUB_SHA"; exit 1
