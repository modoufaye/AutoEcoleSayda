# Met en ligne le site de chaque auto-école active de deploy/clients.json, à chaque push sur main
# touchant le site. GitHub construit le site de chacune (son nom dans .env.production.local), puis
# l'envoie tout construit à son app CapRover : le serveur n'a plus qu'à le servir.
# Jetons : un secret GitHub par auto-école, nommé dans clients.json (jetonSite).
name: Déploiement du site

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'deploy/site/**', 'deploy/clients.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clients:
    runs-on: ubuntu-latest
    outputs:
      liste: ${{ steps.l.outputs.liste }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: l
        run: echo "liste=$(jq -c '[.[] | select(.actif == true)]' deploy/clients.json)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: clients
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Une auto-école en échec n'empêche pas la mise à jour des autres
      fail-fast: false
      matrix:
        client: ${{ fromJSON(needs.clients.outputs.liste) }}
    # Un seul déploiement à la fois par auto-école ; le suivant attend
    concurrency:
      group: deploy-site-${{ matrix.client.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Nom de l'auto-école (titre de l'onglet, application installée) : prime sur frontend/.env
      - name: Construire le site de ${{ matrix.client.nom }}
        working-directory: frontend
        env:
          NOM: ${{ matrix.client.nom }}
          NOM_COURT: ${{ matrix.client.nomCourt }}
          LIEU: ${{ matrix.client.lieu }}
        run: |
          printf 'VITE_ECOLE_NOM=%s\nVITE_ECOLE_NOM_COURT=%s\nVITE_ECOLE_LIEU=%s\n' "$NOM" "$NOM_COURT" "$LIEU" > .env.production.local
          npm ci && npm run build

      # Site déjà construit + nginx : ENV SERVEUR pointe vers le serveur de cette auto-école
      - name: Préparer l'archive
        run: |
          mkdir envoi
          cp -r frontend/dist envoi/dist
          cp frontend/nginx.conf envoi/nginx.conf
          cp deploy/site/Dockerfile envoi/Dockerfile
          echo 'ENV SERVEUR=srv-captain--${{ matrix.client.appServeur }}:8080' >> envoi/Dockerfile
          printf '{\n  "schemaVersion": 2,\n  "dockerfilePath": "./Dockerfile"\n}\n' > envoi/captain-definition
          tar -cf site.tar -C envoi .

      - name: Déployer sur CapRover (app ${{ matrix.client.appSite }})
        env:
          CAPROVER_TOKEN: ${{ secrets[matrix.client.jetonSite] }}
        # Sans jeton, l'outil demande un mot de passe puis quitte en signalant un succès : on refuse
        # donc de partir sans jeton. Avec un jeton, CapRover rend la main dès l'envoi (« in progress »)
        # sans attendre la construction : l'étape suivante vérifie la vraie mise en ligne.
        run: |
          if [ -z "$CAPROVER_TOKEN" ]; then
            echo "::error::Secret ${{ matrix.client.jetonSite }} absent (CapRover → app ${{ matrix.client.appSite }} → Deployment → App Token)"; exit 1
          fi
          npx --yes caprover@2.4.4 deploy \
            --caproverUrl https://captain.khadija.auto-ecole.sn \
            --appToken "$CAPROVER_TOKEN" \
            --appName ${{ matrix.client.appSite }} \
            --tarFile site.tar < /dev/null 2>&1 | tee deploy.log
          grep -qE "Deployed successfully|using app token is in progress" deploy.log \
            || { echo "::error::CapRover a refusé l'envoi"; exit 1; }

      - name: Vérifier que la nouvelle version est en ligne
        run: |
          attendu=$(grep -o 'assets/index-[^"]*\.js' frontend/dist/index.html | head -1)
          for i in $(seq 1 60); do
            servi=$(curl -s https://${{ matrix.client.domaine }}/ | grep -o 'assets/index-[^"]*\.js' | head -1)
            [ "$servi" = "$attendu" ] && { echo "En ligne : $servi"; exit 0; }
            sleep 10
          done
          echo "Le site sert encore $servi au lieu de $attendu"; exit 1
