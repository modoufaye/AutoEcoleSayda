spring.application.name=auto-ecole-senegal

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/autoecole-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console : désactivée par défaut (accès complet à la base, sans mot de passe).
# Activée seulement dans le profil dev (application-dev.properties).
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Données de démonstration (data.sql) : jamais par défaut, donc jamais en production
# (le conteneur lance le jar sans profil). Chargées seulement dans le profil dev.
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# Désactiver open-in-view (bonne pratique)
spring.jpa.open-in-view=false

# Serveur
server.port=8080

# Upload fichiers (images / vidéos)
upload.dir=uploads
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Dates JSON en ISO-8601 (pas de tableau [2024,1,15,...])
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT
jwt.secret=4e616f4b65795365637265744175746545636f6c6553656e6567616c323032346b6579546f6b656e53656372657441757468
jwt.expiration=86400000
