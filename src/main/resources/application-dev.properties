# ══════════════════════════════════════════════════════════
# Profil dev — poste de développement uniquement
# Activé automatiquement par `mvn spring-boot:run` (voir pom.xml).
# Jamais en production : le conteneur lance le jar sans profil.
# ══════════════════════════════════════════════════════════

# Données de démonstration (data.sql) rejouées à chaque démarrage (idempotent)
spring.sql.init.mode=always

# Comptes de démo (moniteurs, élèves) créés par AdminSeeder
demo.comptes=true

# Console H2 : http://localhost:8080/h2-console (JDBC URL jdbc:h2:file:./data/autoecole-db, user sa)
spring.h2.console.enabled=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
