# ══════════════════════════════════════════════════════════
# Profil transfert-h2 — copie unique des données H2 vers PostgreSQL
# À activer UNE fois, au premier démarrage sur PostgreSQL :
#   SPRING_PROFILES_ACTIVE=transfert-h2
# puis à retirer. Sans effet si la base PostgreSQL contient déjà des comptes.
# Voir TransfertH2VersPostgres.
# ══════════════════════════════════════════════════════════

# Fichier H2 à copier, ouvert en lecture seule (IFEXISTS : erreur plutôt qu'une base vide
# créée par erreur si le chemin est faux)
transfert.h2.url=jdbc:h2:file:./data/autoecole-db;IFEXISTS=TRUE;ACCESS_MODE_DATA=r
transfert.h2.utilisateur=sa
transfert.h2.mot-de-passe=
